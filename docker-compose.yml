version: "3.9"

services:
  model:
    build:
      context: .
      dockerfile: Dockerfile.model
    container_name: biomass-model
    ports:
      - "8001:8001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biomass-backend
    env_file:
      - ./backend/.env
    environment:
      MODEL_URL: http://model:8001/predict
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - model

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biomass-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
